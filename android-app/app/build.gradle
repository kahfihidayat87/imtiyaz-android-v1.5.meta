plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.imtiyaztour.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.imtiyaztour.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "2.8.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    // Versi compiler Compose ini WAJIB cocok dengan versi plugin Kotlin (1.9.10) di build.gradle root.
    // Referensi resmi: https://developer.android.com/jetpack/androidx/releases/compose-kotlin
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2023.10.01')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    // Networking - menghubungkan app ke Node.js API (app.js), sebelumnya tidak ada sama sekali
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // FIX: LocationManager mentah Android (dipakai sebelumnya) terbukti tidak cukup
    // andal untuk mendapat fix lokasi baru dengan cepat, terutama di dalam gedung
    // atau sinyal lemah -- jadwal shalat jadi terkesan "tidak update". FusedLocationProvider
    // (Google Play Services) jauh lebih andal karena menggabungkan GPS+WiFi+seluler.
    // Dependency resmi Google, sangat umum dipakai, risiko gagal build sangat kecil.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
