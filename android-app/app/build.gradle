plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'  // FCM
}

android {
    namespace 'com.imtiyaztour.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.imtiyaztour.app"
        minSdk 24
        targetSdk 36
        versionCode 14
        versionName "2.12.0"

        // v2.13.0: Drop ABI yang tidak dipakai HP jamaah fisik.
        // x86/x86_64 hanya untuk emulator (~30 MB), mips/armeabi sudah deprecated.
        // Hasil: APK turun dari ~66 MB ke ~36 MB tanpa ubah kode.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // FIX: Play Store MENOLAK build yang ditandatangani kunci debug (yang dipakai
    // otomatis oleh assembleDebug selama ini) -- wajib kunci rilis sendiri. Kredensial
    // diambil dari environment variable, BUKAN ditulis langsung di sini, supaya kunci
    // rahasia tidak pernah tersimpan di repo Git. Diisi lewat GitHub Secrets saat CI
    // (lihat build-apk.yml), atau lewat environment variable lokal kalau build manual.
    // Kalau env var ini belum diisi (mis. saat cuma build APK debug biasa), signingConfig
    // ini otomatis kosong -- tidak mengganggu assembleDebug sama sekali.
    signingConfigs {
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    // Versi compiler Compose ini WAJIB cocok dengan versi plugin Kotlin (1.9.24) di build.gradle root.
    // Referensi resmi: https://developer.android.com/jetpack/androidx/releases/compose-kotlin
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2023.10.01')

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    // Networking - menghubungkan app ke Node.js API (app.js), sebelumnya tidak ada sama sekali
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // FIX: LocationManager mentah Android (dipakai sebelumnya) terbukti tidak cukup
    // andal untuk mendapat fix lokasi baru dengan cepat, terutama di dalam gedung
    // atau sinyal lemah -- jadwal shalat jadi terkesan "tidak update". FusedLocationProvider
    // (Google Play Services) jauh lebih andal karena menggabungkan GPS+WiFi+seluler.
    // Dependency resmi Google, sangat umum dipakai, risiko gagal build sangat kecil.
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // v2.12.0: peta inline OSM (OpenStreetMap) - gratis, tanpa API key
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // v2.13.0: Firebase Cloud Messaging + Firestore untuk tracking real-time
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // v2.14.0: LiveKit untuk siaran radio TL real-time (WebRTC)
    implementation 'io.livekit:livekit-android:2.29.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
