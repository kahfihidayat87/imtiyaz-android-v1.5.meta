name: Build APK - FIX Node 24 - No Android Studio - v1.5.0

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo - CLEAR
        uses: actions/checkout@v4

      - name: Set up JDK 17 - CLEAR - Works Node 24
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK - FIX Node 24 Error - CLEAR
        run: |
          echo "Fix Node 24 Error - Install SDK manually without android-actions/setup-android@v3"
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "Android SDK installed - CLEAR - Node 24 compatible"

      - name: Grant execute permission gradlew - CLEAR
        run: |
          cd android-app
          chmod +x gradlew || echo "gradlew not found, using gradle directly"
          ls -la

      - name: Build Debug APK - CLEAR - Node 24 FIX
        working-directory: android-app
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "Building APK - 5 Fitur (1,2,3,4,8) - Tanpa 5,6,7,9,GPS,WebView"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info || gradle :app:assembleDebug --no-daemon --stacktrace

      - name: List APK Output - CLEAR
        run: |
          echo "Searching APK..."
          find android-app -name "*.apk" -type f -exec ls -lh {} \;
          ls -lh android-app/app/build/outputs/apk/debug/ || ls -lh android-app/build/outputs/apk/debug/ || echo "Checking other paths"
          find . -name "*.apk" -type f

      - name: Upload APK Artifact - CLEAR - Node 24 FIX
        uses: actions/upload-artifact@v4
        with:
          name: Imtiyaz-v1.5.0-APK-FIX-Node24
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/build/outputs/apk/debug/*.apk
            **/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release with APK - CLEAR
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.5.0-fix-node24-${{ github.run_number }}
          name: Imtiyaz v1.5.0 FIX Node24 - Build ${{ github.run_number }} - 5 Fitur
          body: |
            ✅ FIX Error Node.js v24.19.0 - Setup Android SDK
            ✅ Build via Github Actions - Tanpa Android Studio
            ✅ 5 Fitur (1,2,3,4,8) - Tanpa 5,6,7,9,GPS,WebView
            
            Perubahan FIX:
            - Hapus android-actions/setup-android@v3 (error Node 24)
            - Ganti dengan manual sdkmanager install (work di Node 24)
            - JDK 17 Temurin + Android SDK 34 + Build Tools 34.0.0
            
            Download APK di bawah ini -> Install langsung
          files: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
