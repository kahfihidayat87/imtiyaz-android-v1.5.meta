name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Create local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > android-app/local.properties

      # FIX: repo sekarang sudah menyertakan gradlew + gradle-wrapper.jar asli
      # (sebelumnya file stub 4 baris tanpa jar). Step "Generate Wrapper" yang lama
      # dihapus karena tidak lagi diperlukan -- gradlew di repo sudah lengkap dan
      # akan otomatis mengunduh distribusi Gradle 8.2 sesuai gradle-wrapper.properties.
      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build APK
        working-directory: android-app
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Imtiyaz-APK
          path: android-app/app/build/outputs/apk/debug/*.apk

      # ============================================================
      # BUILD RILIS (AAB) UNTUK PLAY STORE -- hanya jalan kalau ke-4 Secret di
      # bawah sudah diisi di Settings > Secrets and variables > Actions (lihat
      # panduan listing Play Store). Kalau belum diisi, langkah ini otomatis
      # dilewati -- build APK debug di atas tetap jalan seperti biasa, tidak
      # terganggu.
      # ============================================================
      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build Release AAB (Play Store)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Release AAB
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Imtiyaz-AAB-PlayStore
          path: android-app/app/build/outputs/bundle/release/*.aab
