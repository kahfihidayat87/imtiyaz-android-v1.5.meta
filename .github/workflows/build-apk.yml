name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Create local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > android-app/local.properties

      # FIX: repo sekarang sudah menyertakan gradlew + gradle-wrapper.jar asli
      # (sebelumnya file stub 4 baris tanpa jar). Step "Generate Wrapper" yang lama
      # dihapus karena tidak lagi diperlukan -- gradlew di repo sudah lengkap dan
      # akan otomatis mengunduh distribusi Gradle 8.2 sesuai gradle-wrapper.properties.
      - name: Make gradlew executable
        working-directory: android-app
        run: chmod +x gradlew

      - name: Build APK
        working-directory: android-app
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Imtiyaz-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
