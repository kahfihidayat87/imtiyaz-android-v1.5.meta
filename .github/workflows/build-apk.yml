name: Build APK - ROBUST FIX Node24 - v1.5.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK - FIX Node24
        run: |
          echo "Manual SDK install - works Node 24"
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-33"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Wrapper
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Build Debug APK
        working-directory: android-app
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Imtiyaz-APK-v1.5.0-ROBUST
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.5.0-fix-${{ github.run_number }}
          name: Imtiyaz v1.5.0 FIX Node24 - Build ${{ github.run_number }}
          body: |
            FIX Node.js v24.19.0 - Manual SDK install
            5 Fitur (1,2,3,4,8) Tanpa 5,6,7,9,GPS,WebView
          files: android-app/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
