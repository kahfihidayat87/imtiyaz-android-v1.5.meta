name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths: ['imtiyaz-connector/**', 'node-api/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Plugin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./imtiyaz-connector/
          server-dir: /domains/pastiumrah.com/public_html/wp-content/plugins/imtiyaz-connector/
